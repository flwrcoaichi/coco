<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>coco</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.COCO_API_BASE = "https://flowerco.aichi.me";
    </script>
  </head>
  <body>
    <div class="page-shell">
      <div class="diamond-rail left"></div>
      <div class="diamond-rail right"></div>
      <div class="page-inner">
        <header class="topbar">
          <div class="brand">
            <span class="brand-mark"></span>
            <span class="brand-name">coco</span>
          </div>
          <nav class="nav-links">
            <a href="https://github.com/flwrcoaichi/coco" id="source-link-nav">source</a>
            <a href="/docs" id="docs-link">docs</a>
            <a class="button button-tertiary" href="https://discord.gg/vHZKTmJdpf" id="discord">join discord</a>
            <button id="login-button" class="button button-secondary">log in</button>
          </nav>
        </header>

        <section class="hero" id="landing-hero">
          <p class="eyebrow">protect your forest!</p>
          <p class="tagline">discord anti-raid and moderation bot for private servers. fully open-source and self hostable. also sings.</p>
          <div class="hero-actions">
            <button id="invite-button" class="button button-primary">add to your forest!</button>
            <a class="button button-tertiary" href="https://github.com/flwrcoaichi/coco" id="source-link">view source code</a>
          </div>
        </section>

        <footer class="footer-credit">
          created by <span class="pixel-avatar"></span>
        </footer>
      </div>
    </div>
    <script src="/static/landing.js"></script>
  </body>
</html>
