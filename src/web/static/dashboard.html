<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>coco - dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.COCO_API_BASE = "https://flowerco.aichi.me";
    </script>
  </head>
  <body>
    <div class="page-shell">
      <div class="diamond-rail left"></div>
      <div class="diamond-rail right"></div>
      <div class="page-inner">
        <header class="topbar">
          <div class="brand">
            <span class="brand-mark"></span>
            <span class="brand-name">coco</span>
          </div>
          <nav class="nav-links">
            <span id="guild-name">no server selected</span>
            <button id="logout-button" class="button button-secondary">sign out</button>
          </nav>
        </header>

        <nav class="dash-tabs" id="dash-tabs" hidden>
          <button class="dash-tab" data-panel="servers">servers</button>
          <button class="dash-tab" data-panel="config">settings</button>
          <button class="dash-tab" data-panel="moderation">moderation</button>
          <button class="dash-tab" data-panel="tickets">tickets</button>
          <button class="dash-tab" data-panel="containers">buttons</button>
          <button class="dash-tab" data-panel="actions">actions</button>
        </nav>

        <section class="panel" id="signed-out-panel">
          <p class="eyebrow">not signed in</p>
          <h2>log in from the home page first</h2>
          <a class="button button-primary" href="/">go to home</a>
        </section>

        <section class="panel" data-panel-id="servers" hidden>
          <div class="panel-title-row">
            <div>
              <p class="eyebrow">server selector</p>
              <h2>choose a server</h2>
            </div>
          </div>
          <div class="grid-list" id="guild-list"></div>
        </section>

        <section class="panel" data-panel-id="config" hidden>
          <div class="panel-title-row">
            <div>
              <p class="eyebrow">config</p>
              <h2>server settings</h2>
            </div>
          </div>
          <div class="config-grid" id="config-fields">
            <div class="field-group" data-field="moderator_role"><label>moderator role</label><select></select></div>
            <div class="field-group" data-field="admin_role"><label>admin role</label><select></select></div>
            <div class="field-group" data-field="member_role"><label>member role</label><select></select></div>
            <div class="field-group" data-field="image_role"><label>image perms role</label><select></select></div>
            <div class="field-group" data-field="music_role"><label>music role</label><select></select></div>
            <div class="field-group wide" data-field="ticket_channel"><label>ticket panel channel</label><select></select></div>
            <div class="field-group wide" data-field="ticket_message"><label>ticket reason message</label><input type="text" placeholder="ticket reason template" /></div>
            <div class="field-group wide" data-field="announcement_channel"><label>announcement channel</label><select></select></div>
            <div class="field-group wide" data-field="announcement_role"><label>announcement ping role</label><select></select></div>
            <div class="field-group wide" data-field="join_channel"><label>join channel</label><select></select></div>
            <div class="field-group wide" data-field="join_messages"><label>join messages (one per line, {user} and {mention} work)</label><textarea rows="3" placeholder="welcome to the server, {user}!"></textarea></div>
            <div class="field-group wide" data-field="leave_channel"><label>leave channel</label><select></select></div>
            <div class="field-group wide" data-field="leave_messages"><label>leave messages (one per line)</label><textarea rows="3" placeholder="{user} left the server."></textarea></div>
            <div class="field-group wide checkbox-row" data-field="widget_enabled"><label><input type="checkbox" /> show server widget on this dashboard</label></div>
          </div>
          <div id="widget-preview"></div>
          <div class="button-row">
            <button id="save-config" class="button button-primary">save settings</button>
          </div>
        </section>

        <section class="panel" data-panel-id="tickets" hidden>
          <div class="panel-title-row">
            <div>
              <p class="eyebrow">ticket panels</p>
              <h2>manage ticket panel</h2>
            </div>
          </div>
          <div class="config-grid">
            <div class="field-group wide"><label>panel channel</label><select id="ticket-panel-channel"></select></div>
            <div class="field-group wide"><label>panel category</label><select id="ticket-panel-category"></select></div>
            <div class="field-group wide"><label>staff role</label><select id="ticket-panel-staff-role"></select></div>
            <div class="field-group wide"><label>panel title</label><input id="ticket-panel-title" type="text" placeholder="support" /></div>
            <div class="field-group wide"><label>panel description</label><input id="ticket-panel-description" type="text" placeholder="click below to open a ticket" /></div>
            <div class="field-group wide"><label>existing panels</label><div id="ticket-panels-list" class="list-box"></div></div>
          </div>
          <div class="button-row">
            <button id="create-ticket-panel" class="button button-primary">create ticket panel</button>
          </div>
        </section>

        <section class="panel" data-panel-id="containers" hidden>
          <div class="panel-title-row">
            <div>
              <p class="eyebrow">button containers</p>
              <h2>manage containers</h2>
            </div>
          </div>
          <div class="config-grid">
            <div class="field-group wide"><label>container name</label><input id="container-name" type="text" placeholder="help buttons" /></div>
            <div class="field-group wide"><label>accent color</label><input id="container-accent" type="text" placeholder="16777215 or 0xFFAABB" /></div>
            <div class="field-group wide"><label>container items (JSON array)</label><textarea id="container-items" rows="6" placeholder='[{"label":"open","action":"open_ticket"}]'></textarea></div>
            <div class="field-group wide"><label>saved containers</label><div id="container-list" class="list-box"></div></div>
          </div>
          <div class="button-row">
            <button id="save-container" class="button button-primary">save container</button>
          </div>
        </section>

        <section class="panel" data-panel-id="moderation" hidden>
          <div class="panel-title-row">
            <div>
              <p class="eyebrow">moderation</p>
              <h2>moderation settings</h2>
            </div>
          </div>
          <div class="config-grid" id="moderation-fields">
            <div class="field-group" data-field="mute_channel"><label>mute log channel</label><select></select></div>
            <div class="field-group checkbox-row" data-field="lockdown_include_member_role"><label><input type="checkbox" /> lockdowns also silence the member role</label></div>
            <div class="field-group wide checkbox-group" data-field="require_confirm"><label><input type="checkbox" /> require confirmation before mod actions</label></div>
            <div class="field-group wide" data-field="warn_dm"><label>warn - dm message (one per line, picked at random)</label><textarea rows="2"></textarea></div>
            <div class="field-group wide" data-field="warn_channel"><label>warn - channel message</label><textarea rows="2"></textarea></div>
            <div class="field-group wide" data-field="kick_dm"><label>kick - dm message</label><textarea rows="2"></textarea></div>
            <div class="field-group wide" data-field="kick_channel"><label>kick - channel message</label><textarea rows="2"></textarea></div>
            <div class="field-group wide" data-field="ban_dm"><label>ban - dm message</label><textarea rows="2"></textarea></div>
            <div class="field-group wide" data-field="ban_channel"><label>ban - channel message</label><textarea rows="2"></textarea></div>
            <div class="field-group wide" data-field="mute_dm"><label>mute - dm message</label><textarea rows="2"></textarea></div>
            <div class="field-group wide" data-field="mute_channel_msg"><label>mute - channel message</label><textarea rows="2"></textarea></div>
          </div>
          <div class="button-row">
            <button id="save-moderation" class="button button-primary">save moderation settings</button>
          </div>
        </section>

        <section class="panel" data-panel-id="actions" hidden>
          <div class="panel-title-row">
            <div>
              <p class="eyebrow">actions</p>
              <h2>button actions</h2>
            </div>
          </div>
          <div class="grid-list">
            <button class="tile-action button button-tertiary" data-action="play">play a song</button>
            <button class="tile-action button button-tertiary" data-action="pause">pause song</button>
            <button class="tile-action button button-tertiary" data-action="resume">resume song</button>
            <button class="tile-action button button-tertiary" data-action="skip">skip track</button>
            <button class="tile-action button button-tertiary" data-action="stop">stop music</button>
            <button class="tile-action button button-tertiary" data-action="open_twitch">open twitch url</button>
          </div>
        </section>

        <footer class="footer-credit">
          created by <span class="pixel-avatar"></span>
        </footer>
      </div>
    </div>
    <script src="/dashboard.js"></script>
  </body>
</html>
